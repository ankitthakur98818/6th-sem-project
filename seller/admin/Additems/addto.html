
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Product Carousel with Seller Input, Category Details & Cart</title>
  <style>
    :root {
      --primary: #2c7a7b;        /* teal */
      --accent: #ff6b6b;         /* coral (sale badge) */
      --bg: #f7fafc;             /* light gray */
      --text: #2d3748;           /* dark gray */
      --muted: #718096;          /* muted text */
      --border: #e2e8f0;         /* border */
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }
    header, .container { max-width: 1100px; margin: 0 auto; padding: 16px; }
    header h1 { margin: 8px 0 0; font-size: 1.6rem; }
    header small { color: var(--muted); }
    .toolbar {
      display: flex; gap: 8px; align-items: center; justify-content: space-between;
      margin: 8px 0 16px;
    }
    .btn {
      background: var(--primary); color: #fff; border: none; border-radius: 8px;
      padding: 10px 14px; cursor: pointer; font-weight: 600;
    }
    .btn.outline { background: #fff; color: var(--primary); border: 1px solid var(--primary); }
    .btn.muted { background: #edf2f7; color: var(--text); }
    .badge {
      position: absolute; top: 8px; left: 8px; background: var(--accent); color: #fff;
      padding: 4px 8px; border-radius: 999px; font-size: 12px; font-weight: 700;
    }
    .old-price { text-decoration: line-through; color: var(--muted); margin-left: 6px; }

    /* Seller Panel */
    .seller-panel {
      background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px;
    }
    .seller-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
    .seller-grid .full { grid-column: span 6; }
    .seller-grid .half { grid-column: span 3; }
    .seller-grid .third { grid-column: span 2; }
    .seller-grid label { font-size: 12px; color: var(--muted); margin-bottom: 4px; display: block; }
    .seller-grid input, .seller-grid select {
      width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px;
      font-size: 14px; background: #fff;
    }

    /* Carousel */
    .product-carousel {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 240px;
      gap: 16px;
      overflow-x: auto;
      padding-bottom: 8px;
      scroll-snap-type: x mandatory;
    }
    .product-card {
      position: relative; background: #fff; border: 1px solid var(--border);
      border-radius: 12px; padding: 12px; scroll-snap-align: start;
      display: flex; flex-direction: column; gap: 8px;
    }
    .product-card img {
      width: 100%; height: 160px; object-fit: cover; border-radius: 8px; background: #f1f5f9;
    }
    .product-card h3 { font-size: 16px; margin: 4px 0; }
    .price { font-weight: 700; font-size: 14px; }
    .actions { display: flex; gap: 8px; margin-top: auto; }
    .chip {
      background: #edf2f7; color: var(--text); padding: 4px 8px; border-radius: 999px; font-size: 12px;
      width: fit-content; cursor: pointer;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.35); display: none; align-items: center; justify-content: center;
      z-index: 1000;
    }
    .modal {
      width: min(800px, 92vw); background: #fff; border-radius: 12px; border: 1px solid var(--border);
      padding: 16px;
    }
    .modal header { display: flex; justify-content: space-between; align-items: center; }
    .modal .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 12px; }
    .close { cursor: pointer; font-weight: 700; }

    /* Cart Drawer */
    .cart-drawer {
      position: fixed; right: 0; top: 0; width: 360px; max-width: 90vw; height: 100vh;
      background: #fff; border-left: 1px solid var(--border); transform: translateX(100%);
      transition: transform 0.25s ease; z-index: 1100; display: flex; flex-direction: column;
    }
    .cart-drawer.open { transform: translateX(0); }
    .cart-header { padding: 12px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .cart-items { flex: 1; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .cart-item { display: grid; grid-template-columns: 56px 1fr auto; gap: 8px; align-items: center; }
    .cart-item img { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; }
    .cart-footer { padding: 12px; border-top: 1px solid var(--border); }
    .qty { display: inline-flex; gap: 6px; align-items: center; }
    .qty button { padding: 2px 8px; }

    @media (max-width: 720px) {
      .seller-grid { grid-template-columns: repeat(2, 1fr); }
      .seller-grid .third { grid-column: span 2; }
      .seller-grid .half { grid-column: span 2; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Storefront</h1>
    <small>Kathmandu • Prices in Rs.</small>
    <div class="toolbar">
      <div></div>
      <button id="cartToggle" class="btn">Cart (<span id="cartCount">0</span>)</button>
    </div>
  </header>

  <div class="container">
    <!-- Seller Panel (show only for sellers; hidden behind auth in real apps) -->
    <section class="seller-panel" id="sellerPanel">
      <h2 style="margin-top:0;">Seller Panel</h2>
      <form id="sellerForm" class="seller-grid">
        <div class="third">
          <label>Product Name</label>
          <input name="name" required placeholder="e.g., Black Cardamom" />
        </div>
        <div class="third">
          <label>Category</label>
          <select name="category" required>
            <option value="Spices">Spices</option>
            <option value="Seeds">Seeds</option>
            <option value="Herbs">Herbs</option>
            <option value="Oils">Oils</option>
          </select>
        </div>
        <div class="third">
          <label>Image URL</label>
          <input name="image" placeholder="https://..." />
        </div>

        <div class="third">
          <label>Price (Rs.)</label>
          <input name="price" type="number" step="0.01" required placeholder="569" />
        </div>
        <div class="third">
          <label>Old Price (Rs.)</label>
          <input name="oldPrice" type="number" step="0.01" placeholder="700 (optional)" />
        </div>
        <div class="third">
          <label>On Sale?</label>
          <select name="onSale">
            <option value="false">No</option>
            <option value="true">Yes</option>
          </select>
        </div>

        <div class="full" style="display:flex; gap:8px; justify-content:flex-end;">
          <button type="reset" class="btn muted">Reset</button>
          <button type="submit" class="btn">Add Product</button>
        </div>
      </form>
    </section>

    <!-- Product Carousel -->
    <section>
      <h2 style="margin-top:0;">Featured Products</h2>
      <div id="productCarousel" class="product-carousel" aria-live="polite"></div>
    </section>
  </div>

  <!-- Category Modal -->
  <div id="modalBackdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal">
      <header>
        <div>
          <h3 id="modalTitle" style="margin:0;"></h3>
          <small id="modalDesc" style="color:var(--muted);"></small>
        </div>
        <span id="modalClose" class="close">✕</span>
      </header>
      <div id="modalGrid" class="grid"></div>
    </div>
  </div>

  <!-- Cart Drawer -->
  <aside id="cartDrawer" class="cart-drawer" aria-label="Shopping Cart">
    <div class="cart-header">
      <strong>Your Cart</strong>
      <button id="cartClose" class="btn muted">Close</button>
    </div>
    <div id="cartItems" class="cart-items"></div>
    <div class="cart-footer">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <strong>Total: Rs. <span id="cartTotal">0.00</span></strong>
        <button class="btn">Checkout</button>
      </div>
    </div>
  </aside>

  <script>
    // ---------- Data ----------
    const placeholder = (name) =>
      "https://via.placeholder.com/400x300.png?text=" + encodeURIComponent(name);

    const categories = {
      Spices: { description: "Aromatic spices to elevate flavor." },
      Seeds:  { description: "Nutrient-dense seeds for cooking." },
      Herbs:  { description: "Fresh and dried herbs for health." },
      Oils:   { description: "Cold-pressed and refined oils." }
    };

    let products = JSON.parse(localStorage.getItem("products")) || [
      { id: 1, name: "Black Cardamom", price: 569, oldPrice: null, onSale: false, image: "", category: "Spices" },
      { id: 2, name: "Black Mustard",  price: 286, oldPrice: null, onSale: false, image: "", category: "Seeds" },
      { id: 3, name: "Pippali Pepper", price: 629, oldPrice: 700, onSale: true,  image: "", category: "Spices" }
    ];

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    // ---------- Helpers ----------
    const fmt = (n) => (Number(n) || 0).toFixed(2);

    function saveProducts() {
      localStorage.setItem("products", JSON.stringify(products));
    }
    function saveCart() {
      localStorage.setItem("cart", JSON.stringify(cart));
    }

    // ---------- Rendering ----------
    const carouselEl = document.getElementById("productCarousel");
    const cartCountEl = document.getElementById("cartCount");
    const cartDrawerEl = document.getElementById("cartDrawer");
    const cartItemsEl  = document.getElementById("cartItems");
    const cartTotalEl  = document.getElementById("cartTotal");

    function renderCarousel() {
      carouselEl.innerHTML = products.map(p => `
        <div class="product-card ${p.onSale ? "sale" : ""}" data-id="${p.id}">
          ${p.onSale ? `<span class="badge">Sale</span>` : ""}
          ${p.image || placeholder(p.name)}
          <h3>${p.name}</h3>
          <div class="price">Rs. ${fmt(p.price)} ${p.oldPrice ? `<span class="old-price">Rs. ${fmt(p.oldPrice)}</span>` : ""}</div>
          <span class="chip" data-category="${p.category}" title="View ${p.category}">Category: ${p.category}</span>
          <div class="actions">
            <button class="btn outline view-category" data-category="${p.category}">View ${p.category}</button>
            <button class="btn add-to-cart" data-id="${p.id}">Add to Cart</button>
          </div>
        </div>
      `).join("");

      // Bind events after render
      carouselEl.querySelectorAll(".view-category").forEach(btn => {
        btn.addEventListener("click", (e) => openCategoryModal(e.target.dataset.category));
      });
      carouselEl.querySelectorAll(".add-to-cart").forEach(btn => {
        btn.addEventListener("click", (e) => addToCart(Number(e.target.dataset.id)));
      });
      carouselEl.querySelectorAll(".chip").forEach(chip => {
        chip.addEventListener("click", (e) => openCategoryModal(e.target.dataset.category));
      });
    }

    function renderCart() {
      cartItemsEl.innerHTML = cart.map(item => `
        <div class="cart-item">
          ${item.image || placeholder(item.name)}
          <div>
            <div><strong>${item.name}</strong></div>
            <div class="qty">
              <button data-id="${item.id}" class="dec">-</button>
              <span>${item.qty}</span>
              <button data-id="${item.id}" class="inc">+</button>
            </div>
            <small class="muted">Rs. ${fmt(item.price)} each</small>
          </div>
          <div><strong>Rs. ${fmt(item.price * item.qty)}</strong></div>
        </div>
      `).join("");

      const total = cart.reduce((sum, i) => sum + i.price * i.qty, 0);
      cartTotalEl.textContent = fmt(total);
      cartCountEl.textContent = cart.reduce((sum, i) => sum + i.qty, 0);

      // Bind qty events
      cartItemsEl.querySelectorAll(".inc").forEach(btn => btn.addEventListener("click", () => changeQty(Number(btn.dataset.id), +1)));
      cartItemsEl.querySelectorAll(".dec").forEach(btn => btn.addEventListener("click", () => changeQty(Number(btn.dataset.id), -1)));
    }

    // ---------- Cart ----------
    function addToCart(productId) {
      const p = products.find(x => x.id === productId);
      if (!p) return;

      const existing = cart.find(x => x.id === productId);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({ id: p.id, name: p.name, price: Number(p.price), qty: 1, image: p.image });
      }
      saveCart();
      renderCart();
      openCart();
    }

    function changeQty(productId, delta) {
      const idx = cart.findIndex(x => x.id === productId);
      if (idx === -1) return;
      cart[idx].qty += delta;
      if (cart[idx].qty <= 0) cart.splice(idx, 1);
      saveCart();
      renderCart();
    }

    function openCart() { cartDrawerEl.classList.add("open"); }
    function closeCart() { cartDrawerEl.classList.remove("open"); }

    // ---------- Category Modal ----------
    const modalBackdropEl = document.getElementById("modalBackdrop");
    const modalTitleEl = document.getElementById("modalTitle");
    const modalDescEl = document.getElementById("modalDesc");
    const modalGridEl = document.getElementById("modalGrid");
    document.getElementById("modalClose").addEventListener("click", closeModal);
    modalBackdropEl.addEventListener("click", (e) => { if (e.target === modalBackdropEl) closeModal(); });

    function openCategoryModal(category) {
      const meta = categories[category] || { description: "Explore items in this category." };
      const items = products.filter(p => p.category === category);

      modalTitleEl.textContent = category;
      modalDescEl.textContent = meta.description;

      modalGridEl.innerHTML = items.map(p => `
        <div class="product-card" style="border:1px solid var(--border);">
          ${p.onSale ? `<span class="badge">Sale</span>` : ""}
          ${p.image || placeholder(p.name)}
          <h3>${p.name}</h3>
          <div class="price">Rs. ${fmt(p.price)} ${p.oldPrice ? `<span class="old-price">Rs. ${fmt(p.oldPrice)}</span>` : ""}</div>
          <div class="actions">
            <button class="btn add-to-cart" data-id="${p.id}">Add to Cart</button>
          </div>
        </div>
      `).join("");

      // Bind add-to-cart inside modal
      modalGridEl.querySelectorAll(".add-to-cart").forEach(btn => {
        btn.addEventListener("click", (e) => addToCart(Number(e.target.dataset.id)));
      });

      modalBackdropEl.style.display = "flex";
      modalBackdropEl.setAttribute("aria-hidden", "false");
    }

    function closeModal() {
      modalBackdropEl.style.display = "none";
      modalBackdropEl.setAttribute("aria-hidden", "true");
    }

    // ---------- Seller Form ----------
    const sellerFormEl = document.getElementById("sellerForm");
    sellerFormEl.addEventListener("submit", (e) => {
      e.preventDefault();
      const form = new FormData(sellerFormEl);
      const name = form.get("name").trim();
      const category = form.get("category");
      const image = form.get("image").trim();
      const price = Number(form.get("price"));
      const oldPrice = form.get("oldPrice") ? Number(form.get("oldPrice")) : null;
      const onSale = form.get("onSale") === "true";

      const id = Date.now(); // simple unique id for demo
      products.push({ id, name, price, oldPrice, onSale, image, category });
      saveProducts();
      renderCarousel();
      sellerFormEl.reset();
    });

    // ---------- Cart drawer controls ----------
    document.getElementById("cartToggle").addEventListener("click", openCart);
    document.getElementById("cartClose").addEventListener("click", closeCart);

    // ---------- Init ----------
    renderCarousel();
    renderCart();
  </script>
</body>
</html>
